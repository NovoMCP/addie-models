name: Publish Docker image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/novomcp/addie-models
          tags: |
            type=raw,value=latest
            type=sha

      # Authenticate Docker Hub so the QEMU binfmt pull AND the Dockerfile's base-image
      # FROM pull use the per-account (authenticated) rate limit — not the shared-IP
      # anonymous limit that fails on GitHub runners (toomanyrequests on tonistiigi/binfmt).
      # DOCKERHUB_TOKEN should be a read-only personal access token (pull-only blast radius).
      # ESCAPE HATCH: if Docker Hub tightens further, migrate to native arm64 runners
      # (ubuntu-24.04-arm) + manifest-merge — no QEMU, no Docker Hub — rather than nurse this.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
